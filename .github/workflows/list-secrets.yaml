name: list-secrets
# Lists env-var names for the calling app from Azure Key Vault. Values are
# never printed — only names, and only for secrets scoped to this app.
# Output goes to both $GITHUB_STEP_SUMMARY (readable in the UI) and stdout
# (for AI agents that grep the run log).
on:
  workflow_call:
    inputs:
      app_suffix:
        required: false
        type: string
        default: ''
        description: "Appended to <repo>. Mirror of set-secret; scopes the listing to one service in a monorepo."
      keyvault_var:
        required: false
        type: string
        default: LOGISK_KEYVAULT_NAME
      azure_client_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_CLIENT_ID
      azure_tenant_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_TENANT_ID
      azure_subscription_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_SUBSCRIPTION_ID

permissions:
  id-token: write
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars[inputs.azure_client_id_var] }}
          tenant-id: ${{ vars[inputs.azure_tenant_id_var] }}
          subscription-id: ${{ vars[inputs.azure_subscription_id_var] }}

      - name: list secrets
        env:
          KV: ${{ vars[inputs.keyvault_var] }}
          APP_SUFFIX: ${{ inputs.app_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          APP=$(basename "$GITHUB_REPOSITORY")${APP_SUFFIX}

          # Fetch KV names scoped to this app. `Contributor` on the vault would
          # let us list everything; using our least-privileged reader query.
          PROD_NAMES=$(az keyvault secret list --vault-name "$KV" \
            --query "sort_by([?starts_with(name, '${APP}-prod-')].name, &@)" -o tsv || true)
          PREVIEW_NAMES=$(az keyvault secret list --vault-name "$KV" \
            --query "sort_by([?starts_with(name, '${APP}-preview-')].name, &@)" -o tsv || true)

          # Reverse the naming convention: strip prefix, `-` → `_`.
          to_env() {
            local prefix=$1
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              suffix=${name#"$prefix"}
              echo "${suffix//-/_}"
            done
          }

          PROD_ENV=$(echo "$PROD_NAMES" | to_env "${APP}-prod-")
          PREVIEW_ENV=$(echo "$PREVIEW_NAMES" | to_env "${APP}-preview-")

          # Human-readable UI summary.
          {
            echo "# Secrets for \`$APP\`"
            echo
            echo "## Prod (\`<app>-prod-*\` in \`$KV\`)"
            if [ -n "$PROD_ENV" ]; then
              echo "$PROD_ENV" | sed 's/^/- /'
            else
              echo "_none_"
            fi
            echo
            echo "## Preview overrides (\`<app>-preview-*\` in \`$KV\`)"
            if [ -n "$PREVIEW_ENV" ]; then
              echo "$PREVIEW_ENV" | sed 's/^/- /'
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Machine-readable, greppable output for AI agents pulling the log.
          echo "::group::secrets"
          echo "PROD_SECRETS_START"
          echo "$PROD_ENV"
          echo "PROD_SECRETS_END"
          echo "PREVIEW_SECRETS_START"
          echo "$PREVIEW_ENV"
          echo "PREVIEW_SECRETS_END"
          echo "::endgroup::"
