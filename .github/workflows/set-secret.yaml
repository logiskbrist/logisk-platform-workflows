name: set-secret
# Writes a secret to the customer's Key Vault under the naming convention
# from §5.7 of the design doc: <app>-<scope>-<KEY-with-hyphens>. The app
# name comes from the calling repo; scope is prod or preview.
#
# Env-var name derivation (done by ExternalSecrets in the cluster):
#   <app>-prod-STRIPE-KEY   →  STRIPE_KEY
#   <app>-preview-STRIPE-KEY → STRIPE_KEY (overrides prod)
#
# Values never touch git; only pass via workflow_dispatch inputs which
# get masked from logs.
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: "Env var name as the app sees it, e.g. STRIPE_KEY."
      value:
        required: true
        type: string
      preview:
        required: false
        type: boolean
        default: false
        description: "If true, secret is a preview override."
      app_suffix:
        required: false
        type: string
        default: ''
        description: "Appended to <repo>. Use in monorepos to scope secrets per service, e.g. '-web'."
      keyvault_var:
        required: false
        type: string
        default: LOGISK_KEYVAULT_NAME
      azure_client_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_CLIENT_ID
      azure_tenant_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_TENANT_ID
      azure_subscription_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_SUBSCRIPTION_ID

permissions:
  id-token: write
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: mask value in logs
        run: echo "::add-mask::${{ inputs.value }}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars[inputs.azure_client_id_var] }}
          tenant-id: ${{ vars[inputs.azure_tenant_id_var] }}
          subscription-id: ${{ vars[inputs.azure_subscription_id_var] }}

      - name: set secret
        env:
          KV: ${{ vars[inputs.keyvault_var] }}
          NAME_IN: ${{ inputs.name }}
          PREVIEW: ${{ inputs.preview }}
          APP_SUFFIX: ${{ inputs.app_suffix }}
        run: |
          APP=$(basename "$GITHUB_REPOSITORY")${APP_SUFFIX}
          # env-var-safe input must match [A-Z_][A-Z0-9_]*.
          if ! echo "$NAME_IN" | grep -Eq '^[A-Z_][A-Z0-9_]*$'; then
            echo "::error::Secret name must match ^[A-Z_][A-Z0-9_]*$ (got: $NAME_IN)"
            exit 1
          fi
          # KV name uses hyphens.
          KV_KEY_SUFFIX=$(echo "$NAME_IN" | tr '_' '-')
          if [ "$PREVIEW" = "true" ]; then
            KV_NAME="${APP}-preview-${KV_KEY_SUFFIX}"
          else
            KV_NAME="${APP}-prod-${KV_KEY_SUFFIX}"
          fi
          az keyvault secret set \
            --vault-name "$KV" \
            --name "$KV_NAME" \
            --value "${{ inputs.value }}" \
            --output none
          echo "Set $KV_NAME in $KV"
