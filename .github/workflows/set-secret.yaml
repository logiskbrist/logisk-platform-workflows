name: set-secret
# Writes a secret to the customer's Key Vault under the naming convention
# from §5.7 of the design doc: <app>-<scope>-<KEY-with-hyphens>. The app
# name comes from the calling repo; scope is prod or preview.
#
# Env-var name derivation (done by ExternalSecrets in the cluster):
#   <app>-prod-STRIPE-KEY    → STRIPE_KEY on prod pods
#   <app>-preview-STRIPE-KEY → STRIPE_KEY on preview pods
#
# Prod and preview are fully separated — no inheritance. A name set with
# preview=true won't reach prod pods, and a name set without preview=true
# won't reach preview pods. Set both if both need the value.
#
# Values never touch git. Pass the value under `secrets:`, not `with:`:
#
#   uses: logiskbrist/logisk-platform-workflows/.github/workflows/set-secret.yaml@v3
#   with:
#     name: ${{ inputs.name }}
#   secrets:
#     value: ${{ inputs.value }}
#
# GitHub prints every `with:` input in clear text in the "Inputs" group of
# "Set up job", before any step runs, so a value passed as an input is in
# the run log no matter what the steps do. Values under `secrets:` are
# registered as secrets for the called workflow and masked everywhere.
# `inputs.value` is kept only so existing callers keep working; it emits a
# warning and should be dropped in the next major version.
on:
  workflow_call:
    inputs:
      # Azure/KV identity passed from the caller. Org VARIABLES do not cross
      # the org boundary either, so cross-org callers must pass these via
      # `with:` (e.g. azure_client_id: ${{ vars.LOGISK_AZURE_CLIENT_ID }});
      # the *_var indirections below only resolve for same-org callers.
      azure_client_id:
        required: false
        type: string
        default: ''
      azure_tenant_id:
        required: false
        type: string
        default: ''
      azure_subscription_id:
        required: false
        type: string
        default: ''
      keyvault_name:
        required: false
        type: string
        default: ''
      name:
        required: true
        type: string
        description: "Env var name as the app sees it, e.g. STRIPE_KEY."
      value:
        required: false
        type: string
        default: ''
        description: "DEPRECATED: printed in clear text in the run log. Pass the value under `secrets: value:` instead."
      preview:
        required: false
        type: boolean
        default: false
        description: "If true, secret is set for preview pods only (no inheritance from prod)."
      app_suffix:
        required: false
        type: string
        default: ''
        description: "Appended to <repo>. Use in monorepos to scope secrets per service, e.g. '-web'."
      keyvault_var:
        required: false
        type: string
        default: LOGISK_KEYVAULT_NAME
      azure_client_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_CLIENT_ID
      azure_tenant_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_TENANT_ID
      azure_subscription_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_SUBSCRIPTION_ID
    secrets:
      value:
        required: false
        description: "The value to store. Passed as a secret so GitHub masks it in the run log."

permissions:
  id-token: write
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      # Never interpolate the value into a `run:` script with ${{ }}: the
      # expanded script is printed in the step header before ::add-mask::
      # can take effect, and a value containing quotes or $(…) would run
      # as shell. Read it from the environment instead.
      - name: check value
        env:
          FROM_SECRET: ${{ secrets.value != '' }}
          FROM_INPUT: ${{ inputs.value != '' }}
          # Deprecated path only. It is already in the Inputs group, so this
          # costs nothing extra, and it masks the value for the later steps.
          LEGACY_VALUE: ${{ secrets.value == '' && inputs.value || '' }}
        run: |
          if [ "$FROM_SECRET" != "true" ] && [ "$FROM_INPUT" != "true" ]; then
            echo "::error::No value. Pass it under secrets: value: in the caller."
            exit 1
          fi
          if [ "$FROM_SECRET" != "true" ]; then
            echo "::add-mask::$LEGACY_VALUE"
            echo "::warning::The value was passed as an input (with: value:) and is printed in clear text in this run's log under Set up job → Inputs. Pass it under secrets: value: instead, delete this run, and rotate the value."
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id || vars[inputs.azure_client_id_var] }}
          tenant-id: ${{ inputs.azure_tenant_id || vars[inputs.azure_tenant_id_var] }}
          subscription-id: ${{ inputs.azure_subscription_id || vars[inputs.azure_subscription_id_var] }}

      - name: set secret
        env:
          KV: ${{ inputs.keyvault_name || vars[inputs.keyvault_var] }}
          NAME_IN: ${{ inputs.name }}
          PREVIEW: ${{ inputs.preview }}
          APP_SUFFIX: ${{ inputs.app_suffix }}
          VALUE: ${{ secrets.value || inputs.value }}
        run: |
          APP=$(basename "$GITHUB_REPOSITORY")${APP_SUFFIX}
          # env-var-safe input must match [A-Z_][A-Z0-9_]*.
          if ! echo "$NAME_IN" | grep -Eq '^[A-Z_][A-Z0-9_]*$'; then
            echo "::error::Secret name must match ^[A-Z_][A-Z0-9_]*$ (got: $NAME_IN)"
            exit 1
          fi
          # KV name uses hyphens.
          KV_KEY_SUFFIX=$(echo "$NAME_IN" | tr '_' '-')
          if [ "$PREVIEW" = "true" ]; then
            KV_NAME="${APP}-preview-${KV_KEY_SUFFIX}"
          else
            KV_NAME="${APP}-prod-${KV_KEY_SUFFIX}"
          fi
          az keyvault secret set \
            --vault-name "$KV" \
            --name "$KV_NAME" \
            --value "$VALUE" \
            --output none
          echo "Set $KV_NAME in $KV"
