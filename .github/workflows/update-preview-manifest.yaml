name: update-preview-manifest
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      manifest_path:
        required: false
        type: string
        default: manifests/preview/kustomization.yaml
      image_name:
        required: false
        type: string
        default: ''
        description: "If set, scopes the bump to the kustomize images entry with this .name. Required for multi-image manifests."

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # github.head_ref is only populated on pull_request events. Callers
          # trigger this workflow on push, so head_ref is empty — fall back to
          # ref_name (the branch that was pushed). fetch-depth: 0 so the retry
          # rebase below can see history if a concurrent push landed.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: ${{ inputs.image_name }}
          MANIFEST: ${{ inputs.manifest_path }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$IMAGE_NAME" ]; then
            CURRENT=$(yq -r "(.images[] | select(.name == \"$IMAGE_NAME\") | .newTag) // \"\"" "$MANIFEST")
            if [ "$CURRENT" = "$IMAGE_TAG" ]; then
              echo "Preview manifest already at $IMAGE_TAG for $IMAGE_NAME, nothing to do."; exit 0
            fi
            yq -i "(.images[] | select(.name == \"$IMAGE_NAME\") | .newTag) = \"$IMAGE_TAG\"" "$MANIFEST"
          else
            if grep -q "newTag: $IMAGE_TAG" "$MANIFEST"; then
              echo "Preview manifest already at $IMAGE_TAG, nothing to do."; exit 0
            fi
            sed -i "s|newTag: .*|newTag: $IMAGE_TAG|" "$MANIFEST"
          fi

          git config user.email "manifest-bot@logiskbrist.no"
          git config user.name "manifest-bot"
          git add "$MANIFEST"
          MSG="bump preview image${IMAGE_NAME:+ $IMAGE_NAME} to $IMAGE_TAG [skip ci]"
          git commit -m "$MSG"

          attempts=0
          until git push origin "HEAD:$BRANCH"; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 3 ]; then
              echo "::error::push to $BRANCH failed after 3 attempts"
              exit 1
            fi
            echo "push rejected, rebasing and retrying (attempt $attempts)..."
            git pull --rebase origin "$BRANCH"
          done
