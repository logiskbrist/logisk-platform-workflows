name: open-draft-pr
# Opens a draft PR to main for any non-main branch push, so the ArgoCD
# PullRequest generator has something to fire on. Prefers a GitHub App token
# (its PRs *do* trigger follow-on workflows — validated 2026-07-04 spike), and
# falls back to GITHUB_TOKEN when the App isn't configured for this org so the
# preview pipeline still moves even without App creds. Caller `permissions:`
# for the calling job must include `pull-requests: write` for the fallback path.
on:
  workflow_call:
    inputs:
      app_id_var:
        required: false
        type: string
        default: LOGISK_GH_APP_ID
        description: "Kept for backcompat; no longer read — App ID is now taken from secrets.LOGISK_GH_APP_ID directly."
      installation_id_var:
        required: false
        type: string
        default: LOGISK_GH_APP_INSTALLATION_ID
        description: "Kept for backcompat; no longer read."
      private_key_secret:
        required: false
        type: string
        default: LOGISK_GH_APP_PRIVATE_KEY
        description: "Name of the org secret holding the App private key."
    outputs:
      pr_number:
        description: "Number of the PR for this branch — the one just created, or the one that already existed. Empty only if neither could be resolved."
        value: ${{ jobs.open.outputs.pr_number }}

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      # Same resolve/mint/fallback pattern the other three token-using workflows
      # use, so a caller whose org hasn't set the App creds still gets a draft
      # PR (opened via GITHUB_TOKEN — such a PR won't fire pull_request-triggered
      # workflows on creation, but the ArgoCD PullRequest generator polls the
      # GitHub API and doesn't need them).
      - name: resolve App token configuration
        id: appcfg
        env:
          APP_ID: ${{ secrets.LOGISK_GH_APP_ID }}
          HAS_PRIVATE_KEY: ${{ secrets[inputs.private_key_secret] != '' }}
        run: |
          set -euo pipefail
          if [ -n "$APP_ID" ] && [ "$HAS_PRIVATE_KEY" = "true" ]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub App not configured for this org — falling back to GITHUB_TOKEN. The auto-opened draft PR will not fire pull_request-triggered workflows on creation."
          fi

      - name: mint GitHub App token
        id: app_token
        if: steps.appcfg.outputs.use_app == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LOGISK_GH_APP_ID }}
          private-key: ${{ secrets[inputs.private_key_secret] }}
          # Scope the token to the calling repo only.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: open draft PR if none exists
        id: pr
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          BRANCH=${GITHUB_REF##refs/heads/}
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[0].number // ""')
          if [ -z "$EXISTING" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" --base main \
              --draft --title "[preview] $BRANCH" \
              --body "Auto-opened by logisk-platform-workflows for the preview environment."
            EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[0].number // ""')
          else
            echo "PR already exists for $BRANCH (#$EXISTING)"
          fi
          printf 'pr_number=%s\n' "$EXISTING" >> "$GITHUB_OUTPUT"
