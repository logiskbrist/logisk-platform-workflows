name: delete-secret
# Removes a secret from the customer's Key Vault. Mirror of set-secret.yaml.
# The ExternalSecret will drop the env var from the k8s Secret on next refresh.
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      preview:
        required: false
        type: boolean
        default: false
      app_suffix:
        required: false
        type: string
        default: ''
        description: "Appended to <repo>. Mirror of set-secret; must match to delete the same secret."
      keyvault_var:
        required: false
        type: string
        default: LOGISK_KEYVAULT_NAME
      azure_client_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_CLIENT_ID
      azure_tenant_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_TENANT_ID
      azure_subscription_id_var:
        required: false
        type: string
        default: LOGISK_AZURE_SUBSCRIPTION_ID

permissions:
  id-token: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars[inputs.azure_client_id_var] }}
          tenant-id: ${{ vars[inputs.azure_tenant_id_var] }}
          subscription-id: ${{ vars[inputs.azure_subscription_id_var] }}

      - name: delete secret
        env:
          KV: ${{ vars[inputs.keyvault_var] }}
          NAME_IN: ${{ inputs.name }}
          PREVIEW: ${{ inputs.preview }}
          APP_SUFFIX: ${{ inputs.app_suffix }}
        run: |
          APP=$(basename "$GITHUB_REPOSITORY")${APP_SUFFIX}
          if ! echo "$NAME_IN" | grep -Eq '^[A-Z_][A-Z0-9_]*$'; then
            echo "::error::Secret name must match ^[A-Z_][A-Z0-9_]*$ (got: $NAME_IN)"
            exit 1
          fi
          KV_KEY_SUFFIX=$(echo "$NAME_IN" | tr '_' '-')
          if [ "$PREVIEW" = "true" ]; then
            KV_NAME="${APP}-preview-${KV_KEY_SUFFIX}"
          else
            KV_NAME="${APP}-prod-${KV_KEY_SUFFIX}"
          fi
          if az keyvault secret show --vault-name "$KV" --name "$KV_NAME" -o none 2>/dev/null; then
            az keyvault secret delete --vault-name "$KV" --name "$KV_NAME" -o none
            echo "Deleted $KV_NAME from $KV (recoverable via az keyvault secret recover if this was a mistake)."
          else
            echo "$KV_NAME does not exist in $KV — nothing to do."
          fi
