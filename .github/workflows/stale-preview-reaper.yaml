name: stale-preview-reaper
# Nightly cron in THIS repo. For each customer org, mint a scoped GitHub App
# token and close PRs whose HEAD commit is older than IDLE_DAYS days. Closing
# the PR triggers ArgoCD to prune the preview and each app repo's
# `preview-cleanup.yaml` to drop the preview DB.
#
# One matrix entry per customer org. The Logisk GitHub App must be installed
# on each with these permissions: contents:read, metadata:read,
# pull_requests:write. App tokens are scoped per-installation, so we mint one
# token per org — a token minted for the workflow's own org can't act on any
# other.
on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only log what would be closed."
        type: boolean
        default: false

permissions:
  contents: read

env:
  IDLE_DAYS: 7

jobs:
  reap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org:
          - godtbrod
          - GetFocused
    name: reap (${{ matrix.org }})
    steps:
      - name: mint GitHub App token for ${{ matrix.org }}
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LOGISK_GH_APP_ID }}
          private-key: ${{ secrets.LOGISK_GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      - name: reap stale previews in ${{ matrix.org }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ORG: ${{ matrix.org }}
          IDLE_DAYS: ${{ env.IDLE_DAYS }}
          DRY: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          CUTOFF=$((NOW - IDLE_DAYS * 86400))
          CLOSED=0
          SKIPPED=0

          echo "=== org: $ORG (idle >= ${IDLE_DAYS}d) ==="

          # Repos in this org carrying the `logisk-platform` topic.
          REPOS=$(gh api "search/repositories?q=org:${ORG}+topic:logisk-platform&per_page=100" \
            --jq '.items[].name')

          for REPO in $REPOS; do
            gh pr list --repo "$ORG/$REPO" --state open \
              --json number,headRefName --jq '.[]' \
            | while read -r PR; do
                NUM=$(echo "$PR" | jq -r '.number')
                BRANCH=$(echo "$PR" | jq -r '.headRefName')

                # HEAD commit committer time — a `git push` is what should
                # reset the clock, not comments or metadata edits.
                SHA=$(gh api "repos/$ORG/$REPO/pulls/$NUM" --jq '.head.sha')
                COMMIT_TIME=$(gh api "repos/$ORG/$REPO/commits/$SHA" --jq '.commit.committer.date')

                COMMIT_TS=$(date -u -d "$COMMIT_TIME" +%s 2>/dev/null || \
                            date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$COMMIT_TIME" +%s)

                if [ "$COMMIT_TS" -lt "$CUTOFF" ]; then
                  AGE=$(( (NOW - COMMIT_TS) / 86400 ))
                  if [ "$DRY" = "true" ]; then
                    echo "  [dry-run] would close $ORG/$REPO#$NUM ($BRANCH, ${AGE}d idle)"
                    SKIPPED=$((SKIPPED + 1))
                  else
                    echo "  closing $ORG/$REPO#$NUM ($BRANCH, ${AGE}d idle)"
                    gh pr close --repo "$ORG/$REPO" "$NUM" \
                      --comment "Auto-closed after ${AGE}d of inactivity. Reopen to restore the preview."
                    CLOSED=$((CLOSED + 1))
                  fi
                fi
              done
          done

          echo
          echo "Reap complete for $ORG: closed=$CLOSED, dry-run-skipped=$SKIPPED"
