name: stale-preview-reaper
# Nightly cron in THIS repo (not called from customer app repos). Lists open
# PRs across all customer org repos tagged `logisk-platform`, closes any PR
# whose HEAD commit is older than the idle threshold. Closing the PR triggers
# ArgoCD to prune the preview and teardown-preview-db to drop the DB.
#
# NOT a reusable workflow — meant to run on this repo's schedule directly.
# One entry per customer org.
on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only log what would be closed."
        type: boolean
        default: false

permissions:
  contents: read

env:
  IDLE_DAYS: 7
  # Add one entry per customer org. Each must have logisk-platform-workflows
  # installed as a GitHub App with `pull_requests: write`.
  CUSTOMER_ORGS: |
    logiskbrist
    # acmeco
    # customer2

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - name: mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LOGISK_GH_APP_ID }}
          private-key: ${{ secrets.LOGISK_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}   # scope to installer; expand per-org as needed

      - name: reap stale previews
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          IDLE_DAYS: ${{ env.IDLE_DAYS }}
          DRY: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          CUTOFF=$((NOW - IDLE_DAYS * 86400))
          CLOSED=0
          SKIPPED=0

          for ORG in $(echo "${{ env.CUSTOMER_ORGS }}" | sed 's/#.*//' | awk 'NF'); do
            echo "=== org: $ORG ==="

            # Repos with the topic
            REPOS=$(gh api "search/repositories?q=org:${ORG}+topic:logisk-platform" \
              --jq '.items[].name')

            for REPO in $REPOS; do
              # Open PRs in this repo
              PRS=$(gh pr list --repo "$ORG/$REPO" --state open \
                --json number,headRefName,updatedAt \
                --jq '.[]')

              echo "$PRS" | jq -c '.' | while read -r PR; do
                NUM=$(echo "$PR" | jq -r '.number')
                BRANCH=$(echo "$PR" | jq -r '.headRefName')

                # Head commit time via GH API (more accurate than PR updatedAt).
                COMMIT_TIME=$(gh api "repos/$ORG/$REPO/pulls/$NUM" \
                  --jq '.head.sha' \
                  | xargs -I{} gh api "repos/$ORG/$REPO/commits/{}" \
                  --jq '.commit.committer.date')

                COMMIT_TS=$(date -u -d "$COMMIT_TIME" +%s 2>/dev/null || \
                            date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$COMMIT_TIME" +%s)

                if [ "$COMMIT_TS" -lt "$CUTOFF" ]; then
                  AGE=$(( (NOW - COMMIT_TS) / 86400 ))
                  if [ "$DRY" = "true" ]; then
                    echo "  [dry-run] would close $ORG/$REPO#$NUM ($BRANCH, ${AGE}d idle)"
                    SKIPPED=$((SKIPPED + 1))
                  else
                    echo "  closing $ORG/$REPO#$NUM ($BRANCH, ${AGE}d idle)"
                    gh pr close --repo "$ORG/$REPO" "$NUM" \
                      --comment "Auto-closed after ${AGE}d of inactivity. Reopen to restore the preview."
                    CLOSED=$((CLOSED + 1))
                  fi
                fi
              done
            done
          done

          echo
          echo "Reap complete: closed=$CLOSED, dry-run-skipped=$SKIPPED"
