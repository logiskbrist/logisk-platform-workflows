name: build-and-push
on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
        description: "Path to the Dockerfile, relative to context."
      image_suffix:
        required: false
        type: string
        default: ''
        description: "Appended to ghcr.io/<repo>. Use in monorepos to disambiguate services, e.g. '-web'."
    outputs:
      tag:
        description: "The image tag that was built and pushed."
        value: ${{ jobs.build.outputs.tag }}
      image:
        description: "The full image name without tag, e.g. ghcr.io/org/app-web."
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - id: image
        run: echo "name=ghcr.io/${{ github.repository }}${{ inputs.image_suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ github.workflow }}${{ inputs.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}${{ inputs.image_suffix }}
